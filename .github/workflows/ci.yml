name: Creator Studio CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: creator-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint, typecheck, test, schema guardrails, and build
        run: pnpm check

  render-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install worker and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'services/render-worker[dev]'
      - name: Test worker
        run: python -m pytest services/render-worker/tests -q
      - name: Compile worker
        run: python -m compileall -q services/render-worker/src services/render-worker/tests

  repository-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Reject publishing integrations, media, and credential patterns
        shell: bash
        run: |
          if grep -RniE --exclude-dir=.git --exclude='ci.yml' --exclude='*.md' --exclude='README.md' \
            'youtube|instagram|facebook|tiktok|linkedin|social[ _-]?oauth' .; then
            echo 'Publishing integration is outside product scope.' >&2
            exit 1
          fi
          if grep -RniE --exclude-dir=.git --exclude='ci.yml' --exclude='.env.example' --exclude='*.md' \
            '(service[_-]?role|sk-proj-|sb_secret_|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' .; then
            echo 'Potential privileged credential committed.' >&2
            exit 1
          fi
          if find . -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.m4a' -o -iname '*.mp4' -o -iname '*.mov' -o -iname '*.webm' \) -print -quit | grep -q .; then
            echo 'Private/generated media must not be committed.' >&2
            exit 1
          fi
